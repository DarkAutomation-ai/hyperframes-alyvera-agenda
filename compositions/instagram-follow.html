<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --primary: #5c3bff;
        --accent: #6366f1;
        --secondary: #8b5cf6;
        --bg-main: #ffffff;
        --text-main: #1f2937;
        --text-secondary: #6b7280;
        --success: #22c55e;
        --warning: #f97316;
        --error: #ef4444;
        --primary-soft: rgba(92, 59, 255, 0.08);
        --primary-mist: rgba(92, 59, 255, 0.06);
        --primary-border: rgba(92, 59, 255, 0.18);
        --shadow-soft: rgba(92, 59, 255, 0.12);
        --shadow-deep: rgba(31, 41, 55, 0.14);
        --btn-hover: #4b2fe0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background:
          radial-gradient(circle at 14% 12%, rgba(92, 59, 255, 0.12), transparent 26%),
          radial-gradient(circle at 82% 18%, rgba(139, 92, 246, 0.14), transparent 24%),
          radial-gradient(circle at 50% 76%, rgba(99, 102, 241, 0.1), transparent 30%),
          linear-gradient(180deg, #ffffff 0%, #f8f8ff 48%, #f5f3ff 100%);
        overflow: hidden;
      }

      body {
        width: 1080px;
        height: 1920px;
        font-family: "Inter", sans-serif;
        color: var(--text-main);
      }

      [data-composition-id="instagram-follow"] .scene-layer,
      [data-composition-id="instagram-follow"] .lower-third {
        position: absolute;
      }

      [data-composition-id="instagram-follow"] .grid {
        inset: -12%;
        background-image:
          linear-gradient(rgba(92, 59, 255, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(92, 59, 255, 0.08) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: linear-gradient(180deg, transparent 8%, rgba(0, 0, 0, 0.92) 35%, rgba(0, 0, 0, 0.56) 100%);
        opacity: 0.75;
      }

      [data-composition-id="instagram-follow"] .spotlight {
        width: 1280px;
        height: 1280px;
        top: 120px;
        left: -140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(92, 59, 255, 0.16) 0%, rgba(92, 59, 255, 0.08) 34%, transparent 68%);
        filter: blur(28px);
      }

      [data-composition-id="instagram-follow"] .halo {
        width: 700px;
        height: 700px;
        top: 454px;
        left: 190px;
        border-radius: 32px;
        border: 1px solid rgba(92, 59, 255, 0.16);
        box-shadow:
          0 0 0 18px rgba(92, 59, 255, 0.03),
          0 36px 120px rgba(92, 59, 255, 0.14);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.28)),
          rgba(92, 59, 255, 0.04);
        backdrop-filter: blur(12px);
      }

      [data-composition-id="instagram-follow"] .title {
        top: 550px;
        left: 240px;
        width: 720px;
        font-family: "Poppins", sans-serif;
        font-size: 94px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.03;
        color: var(--text-main);
      }

      [data-composition-id="instagram-follow"] .word {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: inline-block;
      }

      [data-composition-id="instagram-follow"] .lower-third {
        bottom: 210px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 30px;
        min-width: 828px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.72)),
          var(--primary-mist);
        border-radius: 28px;
        padding: 28px 34px 28px 28px;
        border: 1px solid rgba(92, 59, 255, 0.14);
        box-shadow:
          0 12px 36px var(--shadow-soft),
          0 24px 90px var(--shadow-deep),
          inset 0 1px 0 rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px);
      }

      [data-composition-id="instagram-follow"] .avatar {
        width: 118px;
        height: 118px;
        border-radius: 24px;
        object-fit: contain;
        flex-shrink: 0;
        background: rgba(92, 59, 255, 0.06);
        padding: 14px;
        border: 1px solid rgba(92, 59, 255, 0.14);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
      }

      [data-composition-id="instagram-follow"] .profile-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-right: 12px;
      }

      [data-composition-id="instagram-follow"] .name-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      [data-composition-id="instagram-follow"] .display-name {
        font-family: "Poppins", sans-serif;
        font-size: 42px;
        font-weight: 600;
        color: var(--text-main);
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      [data-composition-id="instagram-follow"] .verified-badge {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
      }

      [data-composition-id="instagram-follow"] .verified-badge svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      [data-composition-id="instagram-follow"] .handle {
        font-size: 28px;
        font-weight: 500;
        color: var(--accent);
        line-height: 1.3;
      }

      [data-composition-id="instagram-follow"] .follower-count {
        font-size: 25px;
        font-weight: 400;
        color: var(--text-secondary);
        line-height: 1.3;
      }

      [data-composition-id="instagram-follow"] .follow-btn {
        position: relative;
        width: 272px;
        height: 84px;
        border-radius: 22px;
        background: var(--primary);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow:
          0 14px 30px rgba(92, 59, 255, 0.24),
          inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }

      [data-composition-id="instagram-follow"] .btn-text {
        position: absolute;
        font-family: "Inter", sans-serif;
        font-size: 30px;
        font-weight: 500;
        color: #ffffff;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      [data-composition-id="instagram-follow"] .btn-text-follow {
        opacity: 1;
      }

      [data-composition-id="instagram-follow"] .btn-text-following {
        opacity: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      [data-composition-id="instagram-follow"] .chevron-icon {
        display: inline-block;
        width: 18px;
        height: 18px;
      }

      [data-composition-id="instagram-follow"] .chevron-icon svg {
        width: 18px;
        height: 18px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="instagram-follow"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="4.5"
    >
      <div id="grid" class="scene-layer grid"></div>
      <div id="spotlight" class="scene-layer spotlight"></div>
      <div id="halo" class="scene-layer halo"></div>
      <div id="title" class="scene-layer title">
        <span class="word">Agenda,</span> <span class="word">Consulta,</span><br />
        <span class="word">Marketing,</span> <span class="word">Financeiro</span><br />
        <span class="word">e</span> <span class="word">muito</span> <span class="word">mais.</span>
      </div>

      <div
        id="card"
        class="clip lower-third"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      >
        <img class="avatar" src="assets/Alyvera_logo.png" alt="Alyvera" crossorigin="anonymous" />
        <div class="profile-info">
          <div class="name-row">
            <div class="display-name">Alyvera</div>
            <span class="verified-badge"
              ><svg viewBox="0 0 40 40" fill="none">
                <circle cx="20" cy="20" r="20" fill="#5C3BFF" />
                <path d="M17.5 27.5L10 20l2.5-2.5 5 5 10-10L30 15 17.5 27.5z" fill="#fff" /></svg
            ></span>
          </div>
          <div class="handle">@alyvera.agenda</div>
          <div class="follower-count">Agenda viva para sua marca</div>
        </div>
        <div id="follow-btn" class="follow-btn">
          <span id="btn-follow" class="btn-text btn-text-follow">Follow</span>
          <span id="btn-following" class="btn-text btn-text-following">
            <span>Following</span>
            <span class="chevron-icon"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="6 9 12 15 18 9"></polyline></svg
            ></span>
          </span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });

      var card = document.getElementById("card");
      var btn = document.getElementById("follow-btn");
      var textFollow = document.getElementById("btn-follow");
      var textFollowing = document.getElementById("btn-following");

      gsap.set(["#grid", "#spotlight", "#halo", ".word", "#card"], { force3D: true });
      gsap.set(card, { y: 300, opacity: 0 });

      tl.fromTo(
        "#spotlight",
        { opacity: 0, scale: 0.82, x: -120, y: 80 },
        { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.9, ease: "power2.out" },
        0,
      );

      tl.fromTo(
        "#grid",
        { opacity: 0, y: 60 },
        { opacity: 0.75, y: 0, duration: 0.85, ease: "power2.out" },
        0.04,
      );

      tl.fromTo(
        "#halo",
        { opacity: 0, scale: 0.72, rotate: -8 },
        { opacity: 1, scale: 1, rotate: 0, duration: 0.95, ease: "expo.out" },
        0.12,
      );

      tl.fromTo(
        ".word",
        { opacity: 0, y: 50 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.1 },
        0.28,
      );

      tl.to(
        card,
        {
          y: 0,
          opacity: 1,
          duration: 0.55,
          ease: "power3.out",
        },
        0.34,
      );

      tl.to(
        btn,
        {
          scale: 0.92,
          duration: 0.15,
          ease: "power2.out",
        },
        1.15,
      );

      tl.to(
        btn,
        {
          scale: 1,
          duration: 0.4,
          ease: "elastic.out(1, 0.4)",
        },
        1.3,
      );

      tl.to(
        btn,
        {
          backgroundColor: "var(--btn-hover)",
          duration: 0.12,
          ease: "none",
        },
        1.3,
      );

      tl.to(
        textFollow,
        {
          opacity: 0,
          duration: 0.08,
          ease: "none",
        },
        1.3,
      );

      tl.to(
        textFollowing,
        {
          opacity: 1,
          duration: 0.08,
          ease: "none",
        },
        1.33,
      );

      tl.to(
        "#halo",
        { scale: 1.04, opacity: 0.94, duration: 1.8, ease: "sine.inOut" },
        1.55,
      );

      tl.to(
        "#spotlight",
        { x: 42, y: -36, duration: 1.8, ease: "sine.inOut" },
        1.55,
      );

      tl.to(
        "#grid",
        { y: -32, duration: 1.8, ease: "sine.inOut" },
        1.55,
      );

      tl.to(
        card,
        {
          y: 300,
          opacity: 0,
          duration: 0.25,
          ease: "power3.in",
        },
        3.82,
      );

      tl.to(["#title", "#halo", "#spotlight"], { opacity: 0, duration: 0.28, ease: "power2.in" }, 4.02);

      window.__timelines["instagram-follow"] = tl;
    </script>
  </body>
</html>
