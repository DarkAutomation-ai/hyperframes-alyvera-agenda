<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="alyvera-agenda"
      data-start="0"
      data-duration="4.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="instagram-follow-host"
        class="clip"
        data-composition-id="instagram-follow"
        data-composition-src="compositions/instagram-follow.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["alyvera-agenda"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
